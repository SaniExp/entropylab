name: EntropyLab CI/CD

on:
  pull_request:
  push:
    branches: [rock]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

# One version for every job so setup stays in a single place.
env:
  NODE_VERSION: "22"

jobs:
  # ── Build: compile src/ first — every later job tests the generated site ──

  build:
    name: Build · compile site + Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build static site
        run: npm run build
      - name: Prepare static site
        run: |
          mkdir _site
          cp entropylab.html robots.txt sitemap.xml llms.txt _site/
          cp entropylab.html _site/index.html
          cp -r assets _site/assets
          touch _site/.nojekyll
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 7

  # Required aggregate gates. The deployment cannot start until both pass, so
  # it can never race ahead of a failing unit or browser test.
  test-ci:
    name: Test · complete dependency-free suite
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build static site
        run: npm run build
      - name: Run complete CI test suite
        run: npm run test:ci

  test-browser:
    name: Test · Firefox integration suite
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build static site
        run: npm run build
      - name: Run headless Firefox tests
        run: npm run test:browser

  # ── Per-section tests: each runs in its own isolated runner, in parallel ──

  test-network:
    name: Test · network-check (network-check.js)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run network-check tests
        run: npm run test:network

  test-browser-check:
    name: Test · browser sanity checks (browser-check.js)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build static site
        run: npm run build
      - name: Run browser-check tests
        run: npm run test:browser-check

  test-ui:
    name: Test · UI defaults (app.js, index.html, styles.css)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run UI-default tests
        run: npm run test:ui

  test-invariants:
    name: Test · repo invariants (manifest, assets, security)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run source-invariant tests
        run: npm run test:invariants

  test-descriptor:
    name: Test · descriptor QR (watch-only + multisig origins)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run descriptor tests
        run: npm run test:descriptor

  test-seedqr:
    name: Test · SeedQR encoding (locked dependencies + app)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run SeedQR tests
        run: npm run test:seedqr

  test-number-bases:
    name: Test · number-base entropy decoding
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run number-base tests
        run: npm run test:number-bases

  # ── Artifact: commit the rebuilt site after merges to rock ────────────────

  artifact:
    name: Artifact · commit rebuilt site after merge
    if: github.ref == 'refs/heads/rock' && github.event_name == 'push'
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build static site
        run: npm run build
      - name: Commit the generated artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f entropylab.html
          if git diff --cached --quiet; then
            echo "Build output is unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Rebuild site artifact [skip ci]"
          git push

  # ── Verify: independent check of the generated site artifact ──

  verify:
    name: Verify · site artifact (snapshot, manifest, assets)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build static site
        run: npm run build
      - name: Verify site artifact
        run: npm run verify

  # ── Deploy: gated on a good build and a clean verify ──

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/rock' && github.event_name != 'pull_request'
    needs: [build, verify, test-ci, test-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
